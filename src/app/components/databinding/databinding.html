@if(!submitted){
<div class="d-flex w-100 justify-content-center align-items-center min-vh-100">
    <form action="" class="p-3 border shadow-sm">
    <div class="form-floating mb-3">
    <input type="text" id="name" name="name" class="form-control border"[(ngModel)]="name" placeholder="">
    <label for="name">Full Name</label>
    </div>
    <div class="form-floating mb-3">
    <input type="email" id="email" name="email" class="form-control border"[(ngModel)]="email" placeholder="">
    <label for="email">Email Address</label>
    </div>
    <div class="form-floating mb-3">
    <input type="password" id="Password" name="password" class="form-control border"[(ngModel)]="password" placeholder="">
    <label for="password">Password</label>
    </div>
    <button (click)="submit()" class="btn btn-outline-secondary">Submit</button>

</form>
</div>
}
@else {
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="border bg-light p-3">

  <h2>Information Section</h2>
  <p>Full Name :{{name}}</p>
  <p>Email:{{email}}</p>
  <button (click)="form()" class="btn btn-outline-secondary">New Form</button>
</div>
</div>
}
